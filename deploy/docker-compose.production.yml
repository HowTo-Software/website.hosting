# Production stack, run by deploy/deploy.sh from /opt/howtoosoftware-hosting-prototype on the
# production host.
#
# The project, service and container names match the stack that was previously run by hand, so
# the first pipeline deploy replaces that container in place rather than starting a second one
# that would fight it for port 5147.
#
# Secrets come from /opt/howtoosoftware-hosting-prototype/.env (mode 600), which never leaves the
# server. It is read raw - literal KEY=value lines, exactly as `docker run --env-file` reads
# migrate.env - so a password containing $ or quotes is passed through untouched. The image
# reference comes from /opt/howtoosoftware-hosting-prototype/image.env, which deploy.sh rewrites
# on every release.

name: hts-hosting-prototype

services:
  site:
    container_name: hts-hosting-site
    image: ${HTS_IMAGE:?HTS_IMAGE must name the image to run}
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    ports:
      - "5147:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # APP_ALLOWED_HOSTS comes unchanged from the private raw env_file. If unset, the
      # application's explicit allowlist includes host.howto.software and local health checks.
    volumes:
      # Keeps antiforgery tokens and cookies valid across deploys.
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  dataprotection-keys:
