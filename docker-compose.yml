name: hts-hosting-prototype

services:
  site:
    container_name: hts-hosting-site
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - path: .env
        format: raw

    ports:
      - "5147:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Preserve APP_ALLOWED_HOSTS and credential-bearing values from the raw env_file.
